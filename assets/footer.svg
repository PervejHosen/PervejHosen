<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .fade{animation:fade .8s ease-out both}
  .draw{stroke-dasharray:1200;animation:draw 2s ease-out both}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes rise{from{transform:scaleY(0)}}
  @keyframes fade{from{opacity:0}}
  @keyframes draw{from{stroke-dashoffset:1200}}
  @keyframes pulse{50%{opacity:.35}}
</style><rect width="900" height="70" rx="14" fill="#0B1220"/><path d="M36 18H864" stroke="#1E2A44"/><text x="450.0" y="48" text-anchor="middle" class="mono" font-size="12.5" fill="#8A97B4">-- data is only useful when someone makes a decision with it</text></svg>