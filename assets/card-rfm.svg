<svg xmlns="http://www.w3.org/2000/svg" width="440" height="132" viewBox="0 0 440 132" role="img">
<style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .fade{animation:fade .8s ease-out both}
  .draw{stroke-dasharray:1200;animation:draw 2s ease-out both}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes rise{from{transform:scaleY(0)}}
  @keyframes fade{from{opacity:0}}
  @keyframes draw{from{stroke-dashoffset:1200}}
  @keyframes pulse{50%{opacity:.35}}
</style><g class="fade"><rect x=".5" y=".5" width="439" height="131" rx="12" fill="#F7F1E6" stroke="#DCCFB6"/><rect x="0" y="22" width="4" height="34" rx="2" fill="#F2462E"/><text x="22" y="40" class="sans" font-size="17" font-weight="700" fill="#1D4A35">RFM Segmentation</text><text x="22" y="62" class="sans" font-size="12.5" fill="#4F5E52">Customer segments by recency, frequency &amp; spend</text><circle cx="364" cy="60" r="4" fill="#1D4A35"/><circle cx="374" cy="50" r="4" fill="#1D4A35"/><circle cx="382" cy="56" r="4" fill="#1D4A35"/><circle cx="390" cy="38" r="4" fill="#F2462E"/><circle cx="400" cy="44" r="4" fill="#1D4A35"/><circle cx="406" cy="30" r="4" fill="#F2462E"/><circle cx="370" cy="34" r="4" fill="#1D4A35"/><circle cx="396" cy="60" r="4" fill="#1D4A35"/><rect x="22" y="88" width="43" height="24" rx="12" fill="none" stroke="#1D4A35" stroke-opacity=".7"/><text x="44" y="104" text-anchor="middle" class="mono" font-size="11.5" fill="#1D4A35">SQL</text><rect x="71.3" y="88" width="86" height="24" rx="12" fill="none" stroke="#1D4A35" stroke-opacity=".7"/><text x="114" y="104" text-anchor="middle" class="mono" font-size="11.5" fill="#1D4A35">Snowflake</text><rect x="163.2" y="88" width="58" height="24" rx="12" fill="none" stroke="#1D4A35" stroke-opacity=".7"/><text x="192" y="104" text-anchor="middle" class="mono" font-size="11.5" fill="#1D4A35">Excel</text><text x="418" y="105" text-anchor="end" class="mono" font-size="11.5" fill="#B8301C">view repo →</text></g></svg>