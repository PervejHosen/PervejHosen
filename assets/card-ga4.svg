<svg xmlns="http://www.w3.org/2000/svg" width="440" height="132" viewBox="0 0 440 132" role="img">
<style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .fade{animation:fade .8s ease-out both}
  .draw{stroke-dasharray:1200;animation:draw 2s ease-out both}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes rise{from{transform:scaleY(0)}}
  @keyframes fade{from{opacity:0}}
  @keyframes draw{from{stroke-dashoffset:1200}}
  @keyframes pulse{50%{opacity:.35}}
</style><g class="fade"><rect x=".5" y=".5" width="439" height="131" rx="12" fill="#F7F1E6" stroke="#DCCFB6"/><rect x="0" y="22" width="4" height="34" rx="2" fill="#F2462E"/><text x="22" y="40" class="sans" font-size="17" font-weight="700" fill="#1D4A35">Google Merch Store</text><text x="22" y="62" class="sans" font-size="12.5" fill="#4F5E52">E-commerce funnel &amp; behavior from GA4</text><rect x="356" y="24" width="56" height="9" rx="2" fill="#1D4A35" fill-opacity="1.0"/><rect x="363" y="36" width="42" height="9" rx="2" fill="#1D4A35" fill-opacity="0.85"/><rect x="370" y="48" width="28" height="9" rx="2" fill="#1D4A35" fill-opacity="0.7"/><rect x="377" y="60" width="14" height="9" rx="2" fill="#F2462E" fill-opacity="0.55"/><rect x="22" y="88" width="43" height="24" rx="12" fill="none" stroke="#1D4A35" stroke-opacity=".7"/><text x="44" y="104" text-anchor="middle" class="mono" font-size="11.5" fill="#1D4A35">GA4</text><rect x="71.3" y="88" width="114" height="24" rx="12" fill="none" stroke="#1D4A35" stroke-opacity=".7"/><text x="128" y="104" text-anchor="middle" class="mono" font-size="11.5" fill="#1D4A35">Looker Studio</text><text x="418" y="105" text-anchor="end" class="mono" font-size="11.5" fill="#B8301C">view repo →</text></g></svg>