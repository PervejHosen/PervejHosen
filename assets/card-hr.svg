<svg xmlns="http://www.w3.org/2000/svg" width="440" height="132" viewBox="0 0 440 132" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .fade{animation:fade .8s ease-out both}
  .draw{stroke-dasharray:1200;animation:draw 2s ease-out both}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes rise{from{transform:scaleY(0)}}
  @keyframes fade{from{opacity:0}}
  @keyframes draw{from{stroke-dashoffset:1200}}
  @keyframes pulse{50%{opacity:.35}}
</style><g class="fade"><rect x=".5" y=".5" width="439" height="131" rx="12" fill="#111A2E" stroke="#1E2A44"/><rect x="0" y="22" width="4" height="34" rx="2" fill="#FF6B5B"/><text x="22" y="40" class="sans" font-size="17" font-weight="700" fill="#E6ECF8">HR Attrition Dashboard</text><text x="22" y="62" class="sans" font-size="12.5" fill="#8A97B4">What drives employees to leave</text><circle cx="384" cy="46" r="20" fill="none" stroke="#3D6BFF" stroke-width="9"/><circle cx="384" cy="46" r="20" fill="none" stroke="#FF6B5B" stroke-width="9" stroke-dasharray="28 200" transform="rotate(-90 384 46)"/><rect x="22" y="88" width="58" height="24" rx="12" fill="none" stroke="#3D6BFF" stroke-opacity=".7"/><text x="51" y="104" text-anchor="middle" class="mono" font-size="11.5" fill="#E6ECF8">Excel</text><text x="418" y="105" text-anchor="end" class="mono" font-size="11.5" fill="#FF6B5B">view repo →</text></g></svg>